name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:offline
      - run: npm run test:memory
      - name: Verify iOS real-device evidence
        env:
          IOS_EVIDENCE_TRUSTED_PUBLIC_KEY: ${{ vars.IOS_EVIDENCE_TRUSTED_PUBLIC_KEY }}
          IOS_EVIDENCE_MAX_AGE_DAYS: ${{ vars.IOS_EVIDENCE_MAX_AGE_DAYS || '30' }}
        run: npm run verify:ios-evidence -- --evidence docs/qa/ios-evidence.json --evidence-root docs/qa/evidence
      - name: Package static build
        run: cd dist && zip -qr ../roametch-dist.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: roametch-dist
          path: roametch-dist.zip
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" roametch-dist.zip --generate-notes --verify-tag

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: roametch
            context: .
          - name: roametch-relay
            context: ./relay
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/peteliao/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
